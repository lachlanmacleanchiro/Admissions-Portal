# Production stack (deployed via Coolify as a Docker Compose resource).
# SERVICE_USER_POSTGRES / SERVICE_PASSWORD_POSTGRES are Coolify magic variables:
# Coolify generates and stores them automatically on first deploy.
# Variables marked ${VAR:?} must be set in Coolify's Environment Variables tab.
# RESEND_API_KEY and EMAIL_FROM_* are optional fallbacks: they can be set in the app under Settings → Email.
# For local development, use docker-compose.dev.yml (Postgres only).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/nzcc_portal
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_URL: ${AUTH_URL:?}
      AUTH_TRUST_HOST: "true"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-New Zealand College of Chiropractic}
      STORAGE_PROVIDER: local
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: nzcc_portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads:
